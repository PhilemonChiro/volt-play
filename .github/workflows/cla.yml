# Contributor License Agreement check (CLA.md). On a contributor's first pull
# request the bot asks them to reply with the signing sentence; signatures are
# kept once for all Volt repositories, in the cla-signatures branch of
# PhilemonChiro/volt, so signing once covers every repo.
# Needs the repository secret CLA_TOKEN: a fine-grained token with Contents
# read/write on PhilemonChiro/volt (where the signatures are stored).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-document: https://github.com/PhilemonChiro/volt/blob/master/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          remote-organization-name: PhilemonChiro
          remote-repository-name: volt
          allowlist: PhilemonChiro,dependabot[bot]
