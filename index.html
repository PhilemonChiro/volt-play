<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volt Playground</title>
    <meta name="description" content="Write Volt in your browser. Every pin is checked against the ESP32 as you type, with state machine diagrams alongside." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Chivo:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet" />
    <link rel="preload" href="/volt.wasm" as="fetch" type="application/wasm" crossorigin />
  </head>
  <body>
    <header class="top">
      <a class="mark" href="https://voltembedded.com" title="voltembedded.com">
        <img src="/volt-logo.svg" alt="" width="20" height="17" /><span>Volt</span>
      </a>
      <nav class="modes" aria-label="View">
        <button type="button" class="mode" id="go-playground" aria-current="page">Playground</button>
        <button type="button" class="mode" id="learn" aria-pressed="false">Learn Volt</button>
      </nav>

      <div class="menu" id="examples">
        <button type="button" class="menu-button" aria-haspopup="listbox" aria-expanded="false" aria-controls="example-list">
          Examples
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.4" /></svg>
        </button>
        <ul class="menu-list" id="example-list" role="listbox" aria-label="Examples" tabindex="-1" hidden></ul>
      </div>

      <div class="top-actions">
        <button type="button" class="quiet" id="format" title="Format (⌘S)">Format</button>
        <button type="button" class="quiet" id="share">Share</button>
        <a class="solid" href="https://voltembedded.com/#download">Get Volt IDE</a>
      </div>
    </header>

    <main class="split" id="split">
      <aside class="lesson" id="lesson" aria-label="Learn Volt" hidden>
        <div class="lesson-inner">
          <div class="lesson-top">
            <button type="button" class="quiet lesson-courses" id="lesson-courses" hidden>
              <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M6.5 2 3.5 5 6.5 8" fill="none" stroke="currentColor" stroke-width="1.4" /></svg>
              All courses
            </button>
            <button type="button" class="quiet" id="lesson-close">Close</button>
          </div>
          <span class="lesson-step" id="lesson-step"></span>
          <div class="lesson-track" aria-hidden="true"><span id="lesson-progress"></span></div>
          <div class="lesson-content" id="lesson-content" aria-live="polite"></div>
          <div class="lesson-foot" id="lesson-foot">
            <button type="button" class="quiet" id="lesson-back">Back</button>
            <button type="button" class="solid" id="lesson-next">Continue</button>
          </div>
        </div>
      </aside>

      <section class="pane code" aria-label="Program">
        <div class="pane-head">
          <span>main.volt</span>
          <span class="dim">ESP32-DevKitC</span>
        </div>
        <div class="intro" id="intro" hidden>
          <p><strong>Volt is a language for ESP32 firmware.</strong> Every pin is checked against the chip’s datasheet as you type.</p>
          <button type="button" class="solid" id="intro-tour">Take the tour</button>
          <button type="button" class="quiet" id="intro-close" aria-label="Dismiss">Not now</button>
        </div>
        <div class="editor" id="editor"></div>
        <div class="timeline" id="timeline" aria-label="When each timer runs" hidden></div>
        <div class="figure" id="figure" aria-label="State machine diagram" hidden></div>
      </section>

      <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0"></div>

      <section class="pane side" aria-label="Results">
        <div class="tabs" role="tablist" aria-label="Results">
          <button role="tab" id="tab-pins" aria-controls="panel-pins" aria-selected="true">Hardware</button>
          <button role="tab" id="tab-problems" aria-controls="panel-problems" aria-selected="false" tabindex="-1">Problems<span class="count" id="problem-count"></span></button>
          <button role="tab" id="tab-states" aria-controls="panel-states" aria-selected="false" tabindex="-1">State machines</button>
        </div>
        <div class="panel" id="panel-pins" role="tabpanel" aria-labelledby="tab-pins"></div>
        <div class="panel" id="panel-problems" role="tabpanel" aria-labelledby="tab-problems" hidden></div>
        <div class="panel" id="panel-states" role="tabpanel" aria-labelledby="tab-states" hidden></div>
      </section>
    </main>

    <section class="learn-view" id="learn-sheet" aria-labelledby="ls-title" hidden>
      <div class="lv-inner">
        <header class="ls-head">
          <h2 class="ls-title" id="ls-title">Learn Volt</h2>
          <p class="ls-sub" id="ls-sub"></p>
        </header>
        <ol class="ls-grid" id="ls-grid" role="listbox" aria-label="Courses"></ol>
      </div>
    </section>

    <footer class="status">
      <span class="state" id="state" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="state-text">Loading the compiler</span></span>
      <span class="dim" id="timing"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
