<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desk lamp</title></head><body>
<script src="core.js"></script>
<script>
/* Desk lamp with a push button: the tour (a lamp, a button, and a count that's saved).
   How it really works: the button on the desk closes a circuit in its box; the lamp's controller sees the press and
   switches the bulb on for a while. The bulb lights the desk in a pool under the shade.
   Parts: DESK   wooden board
          LAMP   weighted round base . lower arm . elbow joint . upper arm . shade (a cone) . bulb inside the shade . cord
          BUTTON square box . round cap . cable to the lamp base
   Scale: 1 unit = 1 cm. */
const LB_X = 18, LB_Y = 50;                         // lamp base centre
const LE = [14, 47, 30], LT = [34, 36, 44];         // elbow, shade pivot
const LS_DIR = [.32, -.12, -.94];                   // the shade points down at the desk
const BTN = [50, 14];                               // push button box centre (x, y)
const LAMP = PALS.tomato;
const SHADE_LEN = 15, SHADE_R0 = 3.4, SHADE_R1 = 9.5;

const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];

function scene(st, m){
  const dir = norm(LS_DIR), sEnd = add(LT, dir, SHADE_LEN), pool = add(LT, dir, (LT[2] - 3) / -dir[2]);
  let s = `<defs><filter id="lgGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${(6 * INK_K).toFixed(2)}"/></filter></defs>`;
  s += board(0, 0, 64, 70, 3, 6, WOOD);
  const top = boardTop(0, 0, 64, 70, 3, 6);
  // the pool of light on the desk under the shade
  s += clipTo(top, `<g opacity=".55" filter="url(#lgGlow)">${fill(pd(on(PZ(3.1), ellUV(pool[0], pool[1], 15, 12, 28))), '#ffe27a')}</g>`);
  s += castShadow([...on(PZ(3), ellUV(LB_X, LB_Y, 10, 10, 12)), LE, LT, sEnd], 3, top);
  s += castShadow([...on(PZ(3), rrUV(BTN[0] - 7, BTN[1] - 7, BTN[0] + 7, BTN[1] + 7, 2)), [BTN[0], BTN[1], 10]], 3, top);

  const parts = [];
  // cord from the button box to the lamp base, lying on the desk
  const cordPts = [[BTN[0] - 7, BTN[1] + 3, 4], [36, 24, 3.8], [26, 36, 3.8], [LB_X + 6, LB_Y - 9, 4]];
  const cd = pd(cordPts, false);
  parts.push({ box: [[LB_X + 5, BTN[1], 3], [BTN[0] - 6, LB_Y - 8, 5]], svg: `<path d="${cd}" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="${cd}" fill="none" stroke="#f3f0e6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>` });
  // weighted base, arms with a joint, the shade with its bulb
  parts.push({ box: [[LB_X - 10, LB_Y - 10, 3], [LB_X + 10, LB_Y + 10, 8]], svg: cyl(LB_X, LB_Y, 3, 6, 10, LAMP, toneI, 2, 32) + cyl(LB_X, LB_Y, 6, 8, 3.4, METAL, toneI, 1, 18) });
  parts.push({ box: [[LB_X - 2, LE[1] - 2, 8], [LE[0] + 2, LB_Y + 2, LE[2]]], svg: rod([LB_X, LB_Y, 8], LE, 1.3, METAL, toneI, 1.2) });
  parts.push({ box: [[LE[0], LT[1], LE[2]], [LT[0], LE[1], LT[2]]], svg: rod(LE, LT, 1.3, METAL, toneI, 1.2) + cylX(LE[0] - 1.8, LE[0] + 1.8, LE[1], LE[2], 2.4, LAMP, toneI, 1, 16) });
  let shade = rod(LT, sEnd, SHADE_R0, LAMP, toneI, 2.2, SHADE_R1, 24);
  // the bulb, seen glowing in the open end when it faces the viewer
  if (vis(dir)) {
    shade += fill(pd(Array.from({ length: 20 }, (_, i) => { const a = i / 20 * 2 * Math.PI, u = norm(cross(dir, [0, 0, 1])), v = cross(dir, u);
      return add(add(sEnd, u, Math.cos(a) * (SHADE_R1 - 1.5)), v, Math.sin(a) * (SHADE_R1 - 1.5)); })), '#fff3b0');
  }
  shade += cylX(LT[0] - 2, LT[0] + 2, LT[1], LT[2], 2.4, LAMP, toneI, 1, 16);
  parts.push({ box: [[LT[0] - 3, Math.min(LT[1], sEnd[1]) - SHADE_R1, sEnd[2] - SHADE_R1], [sEnd[0] + SHADE_R1, LT[1] + SHADE_R1, LT[2] + 4]], svg: shade });
  // the push button: a box with a round cap, pressed into its collar
  const BOX = PALS.mustard;
  let b = box(BTN[0] - 7, BTN[1] - 7, 3, BTN[0] + 7, BTN[1] + 7, 9, BOX, toneI, 1.8);
  b += cyl(BTN[0], BTN[1], 9, 10, 5.4, DARK, toneI, 1, 24) + cyl(BTN[0], BTN[1], 10, 12.5, 4.2, PALS.tomato, toneI, 1.4, 24);
  parts.push({ box: [[BTN[0] - 7, BTN[1] - 7, 3], [BTN[0] + 7, BTN[1] + 7, 12.5]], svg: b });
  return s + byDepth(parts);
}

const ui = mountFigure({ fig: '02', title: 'Desk lamp', size: [64, 70, 48], palette: 'tomato', state: {}, scene });
</script>
<script src="still.js"></script>
</body></html>
