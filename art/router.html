<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wi-Fi router</title></head><body>
<script src="core.js"></script>
<script src="anim.js"></script>
<script>
/* A Wi-Fi router: the "When things fail" course (connect, and retry when it drops).
   How it really works: the router broadcasts on its antennas; a device that loses the link tries again a few times
   before giving up. The front lights show power, the link, and Wi-Fi activity.
   Parts: CASE   low rounded body on two rubber feet . vent slots on the top
          RADIO  three hinged antennas at the back
          FRONT  status lights: power (green), internet (amber, blinking: retrying), Wi-Fi (green)
          BACK   ports and the power lead
   Scale: 1 unit = 1 cm, modelled 2x. */
const RW = 30, RD = 56, RH = 8;                        // x depth, y width, z height
const OUT = rrUV(0, 2, RD, RH + 2, 3);                 // body profile, on 2 cm feet
const RM = { l: '#fbfaf3', m: '#e3e0d2', d: '#a9a493' };
const ANT = [{ y: 10, a: -14 }, { y: RD / 2, a: 0 }, { y: RD - 10, a: 14 }];   // antennas: y and lean (deg) sideways

function scene(st, m){
  let s = `<defs><filter id="rtGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="${(2.4 * INK_K).toFixed(2)}"/></filter></defs>`;
  const antTip = ({ y, a }) => { const r = a * Math.PI / 180; return [2 - 8, y + Math.sin(r) * 26, RH + 2 + Math.cos(r) * 26]; };
  s += castShadow([...on(PX(0), OUT), ...on(PX(RW), OUT), ...ANT.map(antTip)]);
  const parts = [];
  // antennas: a hinge knuckle on the back edge, then the blade leaning back
  for (const an of ANT) {
    const base = [2, an.y, RH + 1.5], tip = antTip(an);
    parts.push({ box: [[tip[0] - 1.5, Math.min(an.y, tip[1]) - 1.5, RH], [3.5, Math.max(an.y, tip[1]) + 1.5, tip[2] + 1]],
      svg: rod(base, tip, 1.5, DARK, toneI, 1.3, 1.1) + cylX(0, 4, an.y, RH + 1.5, 2, DARK, toneI, 1, 14) });
  }
  let body = extrude(OUT, 0, RW, RM);
  body += fill(pd(on(PZ(RH + 2 + .05), rrUV(4, 4, RW - 4, RD - 4, 2))), RM.l);
  // vent slots on the top
  let v = ''; for (let y = 14; y <= RD - 14; y += 4) v += pd([[9, y, RH + 2.1], [RW - 9, y, RH + 2.1]], false);
  body += `<path d="${v}" fill="none" stroke="${INK}" stroke-width="1.1" opacity=".55"/>`;
  if (facing([1, 0, 0])) {
    body += fill(pd(on(PX(RW), OUT)), tone([1, 0, 0], RM)) + ink(pd(on(PX(RW), OUT)), 2);
    // three status lights with their glow; the internet light is amber: retrying
    // the loop: the link is down and the internet light blinks amber while it retries, three times; then it
    // connects and turns green, and the Wi-Fi light flickers with traffic
    const t = animT(), up = t > .62, k = Math.floor(t * 36);
    const net = up ? '#43c25c' : (t * 36) % 6 < 3 ? '#f4b829' : null;
    const wifi = up && [0, 2, 3, 5, 8, 9, 11].includes(k % 12) ? null : '#43c25c';
    const L = [{ y: RD - 12, col: '#43c25c' }, { y: RD - 20, col: net }, { y: RD - 28, col: wifi }];
    for (const l of L) {
      if (!l.col) { body += shape(on(PX(RW + .2), ellUV(l.y, RH / 2 + 2, 1.1, 1.1, 14)), '#c9c4b3', .7); continue; }
      body += `<g opacity=".7" filter="url(#rtGlow)">${fill(pd(on(PX(RW + .3), ellUV(l.y, RH / 2 + 2, 2.6, 2.6, 16))), l.col)}</g>`;
      body += shape(on(PX(RW + .2), ellUV(l.y, RH / 2 + 2, 1.1, 1.1, 14)), l.col, .7);
    }
    body += tx(RW + .2, 14, RH / 2 + 1, 'VOLT', 3, '#8f8a7a', 800);
  }
  body += hullInk([...on(PX(0), OUT), ...on(PX(RW), OUT)], 2.6);
  parts.push({ box: [[0, 0, 0], [RW, RD, RH + 2]], svg: body });
  // rubber feet sit under the body, so they're always drawn first
  let feet = '';
  for (const y of [8, RD - 8]) feet += box(4, y - 3, 0, RW - 4, y + 3, 2.2, DARK, toneI, .9);
  return s + feet + byDepth(parts);
}

const ui = mountFigure({ fig: '07', title: 'Router', size: [RW, RD, 36], palette: 'cobalt', state: {}, scene });
animPlay(ui);
</script>
<script src="still.js"></script>
</body></html>
