<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather station</title></head><body>
<script src="core.js"></script>
<script src="anim.js"></script>
<script>
/* A small weather station: the Sensors course (a BME280 reads temperature, humidity and pressure).
   How it really works: the sensor sits in a louvred white screen that shades it from the sun and lets air through;
   a cup anemometer on the mast's top spins with the wind. Readings go to the board in the screen.
   Parts: MAST    steel mast . tripod legs . cross arm
          SCREEN  white louvred box with a sloped roof, on the cross arm
          WIND    anemometer hub . three arms . three cups . wind vane with its tail
   Scale: 1 unit = 1 cm. */
const MX = 40, MY = 50, MAST_H = 96;
const WHITE = { l: '#fbfaf3', m: '#e3e0d2', d: '#b4ae9a' };
const POLEM = { l: '#c6ccce', m: '#a4acaf', d: '#6c7579' };
const SX0 = 46, SX1 = 84, SY0 = 31, SY1 = 69, SZ0 = 34, SZ1 = 76;   // the screen, on the arm in front of the mast

function scene(st, m){
  const parts = [];
  const legs = [0, 120, 240].map(a => { const r = (a + 30) * Math.PI / 180; return [MX + 22 * Math.cos(r), MY + 22 * Math.sin(r), 0]; });
  let s = castShadow([...legs, [MX, MY, MAST_H + 6], [SX1, SY0, SZ1], [SX1, SY1, SZ1], [SX0, SY1, SZ0], [MX + 18, MY, MAST_H + 4]]);
  // tripod legs up to a collar, then the mast
  for (const lg of legs) parts.push({ box: [[Math.min(lg[0], MX) - 1, Math.min(lg[1], MY) - 1, 0], [Math.max(lg[0], MX) + 1, Math.max(lg[1], MY) + 1, 30]],
    svg: rod(lg, [MX, MY, 30], 1.2, POLEM, toneI, 1.1) });
  parts.push({ box: [[MX - 2, MY - 2, 0], [MX + 2, MY + 2, MAST_H]], svg: cyl(MX, MY, 0, MAST_H, 1.8, POLEM, toneI, 1.4, 16) + cyl(MX, MY, 28, 32, 2.8, POLEM, toneI, 1, 16) });
  // the arm and the louvred screen on it
  parts.push({ box: [[MX, MY - 1.5, SZ0 - 3], [SX0, MY + 1.5, SZ0 - 1]], svg: box(MX, MY - 1.5, SZ0 - 3, SX0 + 4, MY + 1.5, SZ0 - 1, POLEM, toneI, .9) });
  let scr = box(SX0, SY0, SZ0, SX1, SY1, SZ1, WHITE, toneI, 1.8);
  // louvres: slats across the front and the side
  let l = '';
  for (let z = SZ0 + 3; z < SZ1 - 1; z += 2.6) {
    if (facing([1, 0, 0])) l += pd([[SX1 + .1, SY0 + 1.5, z], [SX1 + .1, SY1 - 1.5, z]], false);
    if (facing([0, -1, 0])) l += pd([[SX0 + 1.5, SY0 - .1, z], [SX1 - 1.5, SY0 - .1, z]], false);
    if (facing([0, 1, 0])) l += pd([[SX0 + 1.5, SY1 + .1, z], [SX1 - 1.5, SY1 + .1, z]], false);
  }
  scr += `<path d="${l}" fill="none" stroke="${INK}" stroke-width=".9" opacity=".6"/>`;
  // the roof: a shallow slab, a little bigger than the box
  scr += box(SX0 - 2, SY0 - 2, SZ1, SX1 + 2, SY1 + 2, SZ1 + 2.5, PALS.mint, toneI, 1.6);
  parts.push({ box: [[SX0 - 2, SY0 - 2, SZ0], [SX1 + 2, SY1 + 2, SZ1 + 2.5]], svg: scr });
  // the anemometer on top: hub, three arms, three cups (cones open sideways)
  const HZ = MAST_H + 2;
  let an = cyl(MX, MY, MAST_H, HZ + 3, 2.6, PALS.mustard, toneI, 1.2, 18);
  // the cups turn a third of a turn per loop, so the loop is seamless
  const spin = animT() * 120;
  const cups = [20, 140, 260].map(a => {
    const r = (a + spin) * Math.PI / 180, end = [MX + 19 * Math.cos(r), MY + 19 * Math.sin(r), HZ + 1.5];
    const tng = [-Math.sin(r), Math.cos(r), 0];
    return { box: [[Math.min(MX, end[0]) - 6, Math.min(MY, end[1]) - 6, HZ - 4], [Math.max(MX, end[0]) + 6, Math.max(MY, end[1]) + 6, HZ + 7]],
      svg: rod([MX, MY, HZ + 1.5], end, .6, POLEM, toneI, .8)
        + rod([end[0] - tng[0] * 2.4, end[1] - tng[1] * 2.4, end[2]], [end[0] + tng[0] * 3.6, end[1] + tng[1] * 3.6, end[2]], 1, PALS.mustard, toneI, 1.3, 5.4, 18) };
  });
  parts.push({ box: [[MX - 3, MY - 3, MAST_H], [MX + 3, MY + 3, HZ + 3]], svg: an });
  parts.push(...cups);
  // a small solar panel on an arm off the mast, tilted toward the sun, charging the station's battery
  const tilt = 35 * Math.PI / 180, pw = 16, ph = 11, PC = [MX - 9, MY, 87];
  const pn = [Math.sin(tilt), 0, Math.cos(tilt)], pv = [-Math.cos(tilt), 0, Math.sin(tilt)];
  const pq = (off) => [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([u, v]) => [0, 1, 2].map(j => PC[j] + [0, 1, 0][j] * u * pw / 2 + pv[j] * v * ph / 2 + pn[j] * off));
  const PA = pq(-.9), PB = pq(0);
  const lerp = (p, q, k) => [0, 1, 2].map(j => p[j] + (q[j] - p[j]) * k);
  let pan = rod([MX - 1.8, MY, PC[2] - 1], [PC[0] - 1, MY, PC[2] - 1], .7, POLEM, toneI, .8);
  pan += loft(PA, PB, n => toneI(n, POLEM));
  if (vis(pn)) {
    pan += shape(PB, '#3d62a6', 1.1);
    let g = '';
    for (const k of [1 / 3, 2 / 3]) g += pd([lerp(PB[0], PB[1], k), lerp(PB[3], PB[2], k)], false);
    g += pd([lerp(PB[0], PB[3], .5), lerp(PB[1], PB[2], .5)], false);
    pan += `<path d="${g}" fill="none" stroke="#c9d6ee" stroke-width=".7" opacity=".75"/>`;
  } else pan += shape(PA, POLEM.d, 1.1);
  pan += hullInk([...PA, ...PB], 1.4);
  parts.push({ box: [[PC[0] - 6, MY - pw / 2, PC[2] - 4], [MX - 2, MY + pw / 2, PC[2] + 4]], svg: pan });
  return s + byDepth(parts);
}

const ui = mountFigure({ fig: '08', title: 'Weather station', size: [86, 64, MAST_H + 8], center: [52, 50], palette: 'mint', state: {}, scene });
animPlay(ui);
</script>
<script src="still.js"></script>
</body></html>
