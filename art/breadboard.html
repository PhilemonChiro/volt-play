<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breadboard</title></head><body>
<script src="core.js"></script>
<script src="anim.js"></script>
<script>
/* A dev board on a breadboard driving an LED: the Pins course (which pin, and what mode).
   How it really works: the board's pins push into the breadboard's rows; a jumper carries GPIO 4 from the board's row
   to the LED's leg; the LED's other leg goes through a resistor to the ground rail. The pin is an output, so the LED lights.
   Parts: BREADBOARD  white body . red and blue power rails . the hole grid . centre channel
          BOARD       blue PCB . metal-can module with its antenna . USB socket . two rows of header pins
          CIRCUIT     yellow jumper . red LED with two legs . resistor with colour bands . black ground jumper
   Scale: 1 unit = 1 mm, modelled 1:1. */
const BW = 60, BD = 166, BT = 9;                 // breadboard: x depth, y length, height
const BBM = { l: '#fbfaf3', m: '#e8e5d8', d: '#b6b09d' };
const PCB = { l: '#3f6fb0', m: '#2f5794', d: '#1b3358' };
const PX0 = 16, PX1 = 44, PY0 = 30, PY1 = 82;   // the dev board on the breadboard
const HOLE = (k) => 6 + 2.54 * 2 * k;            // the y of hole row k
const LED = [39.5, (HOLE(22) + HOLE(23)) / 2];    // LED legs in rows 22 (from the jumper) and 23 (to the resistor)
const RAIL_X = 56;                                // the ground rail's holes, beside the blue stripe

function scene(st, m){
  let s = `<defs><filter id="bbGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="${(3.4 * INK_K).toFixed(2)}"/></filter></defs>`;
  s += castShadow([...on(PZ(0), rectUV(0, 0, BW, BD)), [BW, BD, BT], [0, 0, BT]]);
  // the breadboard body and its top: rails, hole grid, centre channel
  s += box(0, 0, 0, BW, BD, BT, BBM, toneI, 2.2);
  const z = BT + .05;
  let holes = '';
  for (let y = 6; y < BD - 4; y += 2.54 * 2) for (const x of [7, 11.5, 16, 20.5, 25, 35, 39.5, 44, 48.5, 53])
    holes += pd(on(PZ(z), rectUV(x - .6, y - .6, x + .6, y + .6)));
  for (let y = 6; y < BD - 4; y += 2.54 * 2) if (Math.round((y - 6) / 5.08) % 6 !== 5) for (const x of [4, RAIL_X])
    holes += pd(on(PZ(z), rectUV(x - .6, y - .6, x + .6, y + .6)));
  s += fill(holes, '#6e6a5e');
  s += fill(pd(on(PZ(z), rectUV(28.5, 3, 31.5, BD - 3))), BBM.d);
  for (const [x, c] of [[1.5, '#e2483d'], [58.5, '#3b6fd0']]) s += line(on(PZ(z), [[x, 4], [x, BD - 4]]), 0).replace(`stroke="${INK}"`, `stroke="${c}"`).replace('stroke-width="0"', 'stroke-width="1.4"');

  const parts = [];
  // the dev board: PCB, two rows of pins into the breadboard, the module and USB socket
  let b = box(PX0, PY0, BT + 3, PX1, PY1, BT + 4.6, PCB, toneI, 1.6);
  for (let y = PY0 + 3; y < PY1 - 2; y += 2.54 * 2) for (const x of [PX0 + 2, PX1 - 2]) b += box(x - .7, y - .7, BT, x + .7, y + .7, BT + 3, METAL, toneI, .5);
  b += box(PX0 + 4, PY0 + 2, BT + 4.6, PX1 - 4, PY0 + 22, BT + 7.6, METAL, toneI, 1.2);
  b += box(PX0 + 4, PY0 - 4, BT + 4.6, PX1 - 4, PY0 + 2, BT + 5.2, PCB, toneI, .8);      // the antenna end
  b += box(PX0 + 9, PY1 - 3, BT + 4.6, PX1 - 9, PY1 + 2, BT + 7.4, METAL, toneI, .9);       // USB socket
  b += box(PX0 + 8, PY1 - 20, BT + 4.6, PX0 + 13, PY1 - 15, BT + 5.6, DARK, toneI, .7) + box(PX1 - 13, PY1 - 22, BT + 4.6, PX1 - 8, PY1 - 17, BT + 5.6, DARK, toneI, .7);
  parts.push({ box: [[PX0, PY0 - 4, BT], [PX1, PY1 + 2, BT + 7.6]], svg: b });
  // jumpers: a wire bent into a low arch between two holes, in its insulation colour
  const jumper = (p0, p1, h, col) => {
    const jp = [[p0[0], p0[1], BT], [p0[0], p0[1], BT + h], [p1[0], p1[1], BT + h], [p1[0], p1[1], BT]], arc = [];
    for (let i = 0; i <= 16; i++) { const t = i / 16, a = 1 - t;
      arc.push([0, 1, 2].map(k => a * a * a * jp[0][k] + 3 * a * a * t * jp[1][k] + 3 * a * t * t * jp[2][k] + t * t * t * jp[3][k])); }
    const jd = pd(arc, false);
    return { box: [[Math.min(p0[0], p1[0]) - 1, Math.min(p0[1], p1[1]) - 1, BT], [Math.max(p0[0], p1[0]) + 1, Math.max(p0[1], p1[1]) + 1, BT + h]],
      svg: `<path d="${jd}" fill="none" stroke="${INK}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="${jd}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>` };
  };
  // GPIO 4's row over to the LED's first leg, and the board's GND row to the ground rail
  parts.push(jumper([48.5, HOLE(13)], [44, HOLE(22)], 9, '#f4b829'));
  parts.push(jumper([48.5, HOLE(6)], [RAIL_X, HOLE(6)], 3, '#2b2f33'));
  // the LED: two legs into the rows, a red dome; it blinks, on for half of each beat
  const lit = (animT() * 4) % 1 < .5;
  const LR = 2.8, LZ = BT + 5;
  let led = rod([LED[0], HOLE(22), BT], [LED[0], LED[1] - 1, LZ], .35, METAL, toneI, .5) + rod([LED[0], HOLE(23), BT], [LED[0], LED[1] + 1, LZ], .35, METAL, toneI, .5);
  const DOME = lit ? { l: '#ffb39c', m: '#ff7a5a', d: '#d4502f' } : { l: '#d86b55', m: '#b8473a', d: '#7d2c22' };
  led += cyl(LED[0], LED[1], LZ, LZ + 1, LR + .5, lit ? PALS.tomato : { l: '#c95a46', m: '#a8402f', d: '#6e2419' }, toneI, .9, 20);
  const dome = [];
  for (let i = 0; i <= 6; i++) dome.push(on(PZ(LZ + 1 + 5.5 * Math.sin(i / 6 * Math.PI / 2)), ellUV(LED[0], LED[1], LR * Math.cos(i / 6 * Math.PI / 2) + .01, LR * Math.cos(i / 6 * Math.PI / 2) + .01, 20)));
  led += `<g>${Array.from({ length: 6 }, (_, i) => loft(dome[i], dome[i + 1], n => toneI(n, DOME))).join('')}</g>`;
  if (lit) led += `<g opacity=".8" filter="url(#bbGlow)">${fill(pd(on(PZ(LZ + 4), ellUV(LED[0], LED[1], 8, 8, 20))), '#ff6a4c')}</g>`;
  led += hullInk([...dome[0], ...dome[6]], 1.2);
  parts.push({ box: [[LED[0] - 3, LED[1] - 3, BT], [LED[0] + 3, LED[1] + 3, LZ + 7]], svg: led });
  // the resistor from the LED's second row to the ground rail: legs bent down into the holes, a banded body
  const RY = HOLE(23), RZ = BT + 2.4, RX0 = 48.5, RX1 = RAIL_X;
  let r = rod([RX0, RY, BT], [RX0, RY, RZ], .3, METAL, toneI, .5) + rod([RX1, RY, BT], [RX1, RY, RZ], .3, METAL, toneI, .5);
  r += rod([RX0, RY, RZ], [RX1, RY, RZ], .3, METAL, toneI, .5);
  const RC = (RX0 + RX1) / 2;
  r += rod([RC - 2.6, RY, RZ], [RC + 2.6, RY, RZ], 1.3, matOf('#e6cfa0'), toneI, .8);
  for (const [k, c] of [[-1.8, '#7a4a22'], [-.6, '#231e16'], [.6, '#e2483d'], [1.8, '#c9a227']]) r += rod([RC + k - .3, RY, RZ], [RC + k + .3, RY, RZ], 1.35, matOf(c), toneI, 0);
  parts.push({ box: [[RX0 - .5, RY - 1.5, BT], [RX1 + .5, RY + 1.5, RZ + 1.4]], svg: r });
  return s + byDepth(parts);
}

const ui = mountFigure({ fig: '09', title: 'Breadboard', size: [BW, BD, 24], palette: 'cobalt', state: {}, scene });
animPlay(ui);
</script>
<script src="still.js"></script>
</body></html>
